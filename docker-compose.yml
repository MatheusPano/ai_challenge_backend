services:
  mysql:
    image: mysql:8.0
    container_name: ai_challenge_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ai_challenge}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai_challenge_pgvector
    restart: unless-stopped
    ports:
      - "${RAG_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${RAG_DB_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag}
      POSTGRES_DB: ${RAG_DB_NAME:-ai_challenge_rag}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-rag} -d ${RAG_DB_NAME:-ai_challenge_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai_challenge_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_NAME: ${DB_NAME:-ai_challenge}
      RAG_DB_HOST: pgvector
      RAG_DB_PORT: 5432
      RAG_DB_USER: ${RAG_DB_USER:-rag}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-rag}
      RAG_DB_NAME: ${RAG_DB_NAME:-ai_challenge_rag}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      GEMINI_EMBEDDING_DIMS: ${GEMINI_EMBEDDING_DIMS:-768}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      RAG_DATA_DIR: ${RAG_DATA_DIR:-src/rag/data}
      PORT: 4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

volumes:
  mysql_data:
  pgvector_data:
  backend_node_modules:
